<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<!-- Ảnh cover TikTok 1080x1920. make_cover.py thay các chỗ __X__. -->
<style>
  :root{--bg:#0A1322;--gold:#C9A45C;--gold2:#E7CF98;--mute:#9AA6B8}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg)}
  body{position:relative;color:#fff;font-family:"Inter",sans-serif}
  .photo{position:absolute;inset:0;background:url("__BG__") center/cover no-repeat;filter:saturate(.85) brightness(.9)}
  .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,19,34,.55) 0%,rgba(10,19,34,.25) 30%,rgba(10,19,34,.55) 52%,rgba(10,19,34,.94) 72%,rgba(10,19,34,.98) 100%)}
  .frame{position:absolute;inset:36px;border:2px solid rgba(201,164,92,.55)}
  /* tên kênh trên cùng */
  .brand{position:absolute;top:270px;left:100px;right:100px;display:flex;align-items:center;gap:18px}
  .brand .line{flex:1;height:2px;background:rgba(201,164,92,.6)}
  .brand .t{font:800 30px "Montserrat";letter-spacing:.2em;color:var(--gold2);text-transform:uppercase;white-space:nowrap}
  /* con số lớn */
  .num{position:absolute;left:100px;right:100px;top:360px;font:900 300px/0.9 "Montserrat";color:var(--gold2);letter-spacing:-.04em;text-shadow:0 10px 40px rgba(0,0,0,.55)}
  .numlab{position:absolute;left:106px;right:200px;top:640px;font:700 44px/1.2 "Montserrat";color:#fff;text-shadow:0 4px 18px rgba(0,0,0,.7)}
  /* tiêu đề */
  .title{position:absolute;left:100px;right:200px;bottom:640px;font:900 92px/1.04 "Montserrat";text-transform:uppercase;letter-spacing:-.01em;text-shadow:0 6px 30px rgba(0,0,0,.6)}
  .title em{font-style:normal;color:var(--gold2)}
  .kicker{position:absolute;left:100px;bottom:__KICKBOTTOM__px;display:inline-block;background:var(--gold);color:var(--bg);font:800 30px "Montserrat";letter-spacing:.16em;padding:10px 20px;text-transform:uppercase}
  /* chân dung + tên ở dưới (nằm trên vùng caption của TikTok) */
  .who{position:absolute;left:100px;right:200px;bottom:420px;display:flex;align-items:center;gap:28px}
  .ava{width:180px;height:180px;border-radius:50%;border:6px solid var(--gold);box-shadow:0 10px 30px rgba(0,0,0,.6);flex:none}
  .nm{font:800 40px/1.2 "Montserrat";text-transform:uppercase;color:#fff}
  .nm span{display:block;font-weight:600;color:var(--gold2);font-size:34px;margin-top:6px}
  .dt{font:500 28px "Inter";color:var(--mute);margin-top:10px;letter-spacing:.04em}
</style>
</head>
<body>
<div class="photo"></div><div class="shade"></div><div class="frame"></div>
<div class="brand"><div class="t">__TAG__</div><div class="line"></div></div>
__NUMBLOCK__
<div class="kicker">__KICKER__</div>
<div class="title" id="title">__TITLE__</div>
<div class="who">__AVATAR__<div><div class="nm">__NAME_MAIN__<span>__NAME_SUB__</span></div><div class="dt">__DATE__</div></div></div>
<script>
// thu nhỏ tiêu đề nếu quá dài (tối đa ~4 dòng)
const t=document.getElementById('title'); let fs=92;
while(t.scrollHeight>4*fs*1.06 && fs>60){fs-=4; t.style.fontSize=fs+'px';}
// đặt nhãn ngay trên tiêu đề
document.querySelector('.kicker').style.bottom=(640+t.offsetHeight+24)+'px';
</script>
</body>
</html>

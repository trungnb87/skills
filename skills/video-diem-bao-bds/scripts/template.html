<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<!-- Lớp chữ trong suốt 1080x1920 đè lên video nền. build_video.py thay các chỗ __X__. -->
<style>
  :root{
    --bg:#0A1322; --ink:#F4EFE6; --mute:#9AA6B8;
    --gold:#C9A45C; --gold2:#E7CF98; --line:rgba(201,164,92,.35);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;overflow:hidden;background:transparent}
  body{font-family:"Inter",sans-serif;color:var(--ink);position:relative}
  /* lớp tối giúp chữ nổi trên video nền */
  .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,19,34,.92) 0%,rgba(10,19,34,.55) 38%,rgba(10,19,34,.35) 55%,rgba(10,19,34,.85) 80%,rgba(10,19,34,.95) 100%)}

  /* header: ảnh chân dung + tên kênh + nhãn + ngày */
  .ava{position:absolute;top:250px;left:96px;width:160px;height:160px;border-radius:50%;border:5px solid var(--gold);box-shadow:0 8px 30px rgba(0,0,0,.5);background:#0A1322}
  .who{position:absolute;top:268px;left:280px;right:180px}
  .who.noava{left:100px}
  .name{font:800 36px/1.25 "Montserrat";letter-spacing:.01em;text-transform:uppercase;white-space:nowrap;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.6)}
  .name span{font-weight:600;color:var(--gold2)}
  .hdr{display:flex;align-items:center;gap:20px;margin-top:14px}
  .tag{font:700 24px "Montserrat";letter-spacing:.18em;color:var(--bg);background:var(--gold);padding:8px 16px}
  .date{font:500 28px "Inter";color:var(--mute);letter-spacing:.04em}
  .bar-top{position:absolute;top:440px;left:100px;width:780px;height:2px;background:var(--line)}
  .progress{position:absolute;top:440px;left:100px;height:2px;background:var(--gold);width:0}
  .src{position:absolute;bottom:420px;left:100px;right:200px;font:500 24px "Inter";color:var(--mute);letter-spacing:.03em}

  /* vùng an toàn TikTok (đã đo trên iPhone): trên cùng ~230px là thanh tìm kiếm, hai bên bị cắt ~55px,
     cột nút bên phải từ x≈900, y≈920 trở xuống, tên kênh + caption từ y≈1730. Nội dung cảnh: x 100–880, y 480–1260 */
  .scene{position:absolute;left:100px;right:200px;top:480px;height:780px;opacity:0}
  .kick{font:700 28px "Montserrat";letter-spacing:.16em;color:var(--gold);text-transform:uppercase;margin-bottom:22px}
  .h1{font:800 82px/1.08 "Montserrat";letter-spacing:-.01em}
  .h2{font:700 60px/1.15 "Montserrat"}
  .body{font:500 40px/1.35 "Inter";color:#D8DEE8}
  .gold{color:var(--gold2)}
  .huge{font:900 300px/0.9 "Montserrat";color:var(--gold2);letter-spacing:-.04em}
  .big{font:900 180px/0.95 "Montserrat";color:var(--gold2);letter-spacing:-.03em}

  .row{margin:0 0 22px}
  .row .lab{display:flex;justify-content:space-between;font:600 36px "Inter";margin-bottom:10px}
  .row .lab b{font:800 40px "Montserrat";color:var(--gold2)}
  .track{height:28px;background:rgba(255,255,255,.07)}
  .fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));transform-origin:left;transform:scaleX(0)}
  .row.dim .fill{background:#5E6B80}
  .badge{display:inline-block;margin-top:16px;border:2px solid var(--gold);padding:16px 26px;font:700 38px "Montserrat";background:rgba(10,19,34,.55)}

  .stat{border-left:6px solid var(--gold);padding:6px 0 6px 28px;margin-bottom:26px;background:linear-gradient(90deg,rgba(10,19,34,.7),transparent)}
  .stat .n{font:900 104px/1 "Montserrat";color:var(--gold2)}
  .stat .t{font:500 34px/1.28 "Inter";color:#D8DEE8;margin-top:6px}

  .rank{display:flex;align-items:center;gap:28px;padding:14px 24px;margin-bottom:12px;background:rgba(10,19,34,.55);font:600 42px "Inter"}
  .rank .no{font:800 44px "Montserrat";color:var(--mute);width:110px;white-space:nowrap}
  .rank.me{background:var(--gold);color:var(--bg)}
  .rank.me .no{color:var(--bg)}
  .chips{display:flex;gap:22px;margin-top:28px}
  .chip{flex:1;padding:26px;border:2px solid var(--line);background:rgba(10,19,34,.55)}
  .chip .k{font:600 28px "Inter";color:var(--mute);margin-bottom:10px}
  .chip .v{font:800 64px "Montserrat";color:var(--gold2)}
  .chip .s{font:500 28px "Inter";color:#D8DEE8;margin-top:6px}

  /* phụ đề */
  .cap{position:absolute;left:100px;right:200px;bottom:470px;min-height:150px;display:flex;align-items:flex-end}
  .cap span{font:700 50px/1.25 "Inter";background:rgba(10,19,34,.82);padding:10px 22px;box-decoration-break:clone;-webkit-box-decoration-break:clone;color:#fff}
  .cap span em{font-style:normal;color:var(--gold2)}

  /* hiệu ứng, điều khiển theo thời gian bằng currentTime */
  .fx{animation-fill-mode:both!important;animation-play-state:paused!important;animation-timing-function:cubic-bezier(.2,.8,.2,1)!important}
  @keyframes up{from{opacity:0;transform:translateY(60px)}to{opacity:1;transform:none}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(var(--w))}}
  @keyframes pop{0%{opacity:0;transform:scale(.6)}70%{opacity:1;transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
</style>
</head>
<body>
<div class="scrim"></div>
__AVATAR__
<div class="who __WHOCLASS__"><div class="name">__NAME_MAIN__ <span>__NAME_SUB__</span></div>
  <div class="hdr"><div class="tag">__TAG__</div><div class="date">__DATE__</div></div></div>
<div class="bar-top"></div><div class="progress" id="prog"></div>

__SCENES__

<div class="cap" id="cap"><span></span></div>
<div class="src">__SOURCE__</div>

<script>
const LINES = __LINES__;      // [{start,dur,text}] mốc thời gian lấy từ giọng đọc
const SCENES = __SCENE_TIMES__; // [{in,out}]
const TOTAL = __TOTAL__;
// Gắn thời gian cho từng cảnh và hiệu ứng: data-fx (up|pop|fade|grow), data-at = giây tính từ đầu cảnh
const DUR={up:.6,pop:.7,fade:.6,grow:1.0};
document.querySelectorAll('.scene').forEach((s,i)=>{
  s.dataset.in=SCENES[i].in; s.dataset.out=SCENES[i].out;
  const len=SCENES[i].out-SCENES[i].in;
  s.querySelectorAll('[data-fx]').forEach(el=>{
    const fx=el.dataset.fx, at=Math.min(parseFloat(el.dataset.at||0), Math.max(0,len-1));
    el.classList.add('fx');
    el.style.animation=`${fx} ${el.dataset.dur||DUR[fx]}s ${SCENES[i].in+at}s`;
  });
  s.querySelectorAll('[data-count]').forEach(el=>{el.dataset.t0=SCENES[i].in+parseFloat(el.dataset.at||0.2);});
});
// chia câu đọc thành các cụm phụ đề ngắn, thời lượng theo số ký tự
const CHUNKS=[];
for(const L of LINES){
  const words=L.text.split(/\s+/); const parts=[]; let cur=[];
  for(const w of words){cur.push(w); const n=cur.join(' ').length; if(n>38 || (/[,.]$/.test(w)&&n>14)){parts.push(cur.join(' '));cur=[];}}
  if(cur.length)parts.push(cur.join(' '));
  const tot=parts.reduce((a,p)=>a+p.length,0); let t=L.start;
  for(const p of parts){const d=L.dur*p.length/tot; CHUNKS.push({s:t,e:t+d,text:p}); t+=d;}
}
const HL=__HIGHLIGHT__;
const hl=s=>s.replace(new RegExp('(\\d[\\d.,]*\\s*%?'+(HL.length?'|'+HL.join('|'):'')+')','g'),'<em>$1</em>');
const cap=document.querySelector('#cap span');
const scenes=[...document.querySelectorAll('.scene')];
const counters=[...document.querySelectorAll('[data-count]')];
const ease=x=>1-Math.pow(1-x,3);
window.render=function(t){
  for(const a of document.getAnimations()) a.currentTime=t*1000;
  for(const s of scenes){
    const i=+s.dataset.in,o=+s.dataset.out; let op=0;
    if(t>=i&&t<o){op=Math.min(1,(t-i)/0.25,(o-t)/0.25);}
    s.style.opacity=Math.max(0,op);
  }
  for(const c of counters){
    const k=Math.max(0,Math.min(1,(t-+c.dataset.t0)/parseFloat(c.dataset.dur||2.2)));
    c.textContent=Math.round(+c.dataset.count*ease(k)).toLocaleString('de-DE')+(c.dataset.suffix||'');
  }
  const ch=CHUNKS.find(c=>t>=c.s&&t<c.e);
  cap.innerHTML=ch?hl(ch.text):''; cap.style.display=ch?'inline':'none';
  document.getElementById('prog').style.width=(780*Math.min(1,t/TOTAL))+'px';
};
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<!-- Lớp chữ trong suốt 1080x1920 đè lên video nền. build_video.py thay các chỗ __X__. -->
<style>
  :root{
    --bg:#0A1322; --ink:#F4EFE6; --mute:#9AA6B8;
    --gold:#C9A45C; --gold2:#E7CF98; --line:rgba(201,164,92,.35);
  }
  /* màu nhấn theo loại tin ("theme" trong spec) để các video trên lưới kênh không giống hệt nhau */
  body.theme-luat{--gold:#E5484D;--gold2:#FF9B8F;--line:rgba(229,72,77,.4)}
  body.theme-thitruong{--gold:#3D8BFD;--gold2:#9CC4FF;--line:rgba(61,139,253,.4)}
  body.theme-hatang{--gold:#1FB59A;--gold2:#86E3CF;--line:rgba(31,181,154,.4)}
  body.theme-hangsang{--gold:#C9A45C;--gold2:#E7CF98;--line:rgba(201,164,92,.35)}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;overflow:hidden;background:transparent}
  body{font-family:"Inter",sans-serif;color:var(--ink);position:relative}
  /* lớp tối giúp chữ nổi trên video nền */
  .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,19,34,.92) 0%,rgba(10,19,34,.55) 38%,rgba(10,19,34,.35) 55%,rgba(10,19,34,.85) 80%,rgba(10,19,34,.95) 100%)}

  /* header: ảnh chân dung + tên kênh + nhãn + ngày */
  .ava{position:absolute;top:250px;left:96px;width:160px;height:160px;border-radius:50%;border:5px solid var(--gold);box-shadow:0 8px 30px rgba(0,0,0,.5);background:#0A1322}
  .who{position:absolute;top:268px;left:280px;right:180px}
  .who.noava{left:100px}
  .name{font:800 36px/1.25 "Montserrat";letter-spacing:.01em;text-transform:uppercase;white-space:nowrap;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.6)}
  .name span{font-weight:600;color:var(--gold2)}
  .hdr{display:flex;align-items:center;gap:20px;margin-top:14px}
  .tag{font:700 24px "Montserrat";letter-spacing:.18em;color:var(--bg);background:var(--gold);padding:8px 16px}
  .step{font:800 30px "Montserrat";color:var(--gold2);letter-spacing:.06em;border:2px solid var(--gold);padding:5px 14px}
  .step:empty{display:none}
  .date{font:500 28px "Inter";color:var(--mute);letter-spacing:.04em}
  .bar-top{position:absolute;top:440px;left:100px;width:780px;height:2px;background:var(--line)}
  .progress{position:absolute;top:440px;left:100px;height:2px;background:var(--gold);width:0}
  .src{position:absolute;bottom:420px;left:100px;right:200px;font:500 24px "Inter";color:var(--mute);letter-spacing:.03em}

  /* vùng an toàn TikTok (đã đo trên iPhone): trên cùng ~230px là thanh tìm kiếm, hai bên bị cắt ~55px,
     cột nút bên phải từ x≈900, y≈920 trở xuống, tên kênh + caption từ y≈1730. Nội dung cảnh: x 100–880, y 480–1260 */
  .scene{position:absolute;left:100px;right:200px;top:480px;height:780px;opacity:0}
  /* CẢNH MÓC (3 giây đầu): chữ cực lớn + chân dung, hiện ngay từ khung hình đầu tiên, ẩn header và phụ đề */
  .scene.hook{top:300px;height:960px}
  .hookwho{display:flex;align-items:center;gap:26px;margin-bottom:56px}
  .hookava{width:200px;height:200px;border-radius:50%;border:6px solid var(--gold);box-shadow:0 10px 34px rgba(0,0,0,.55);background:#0A1322}
  .hookname{font:800 34px/1.2 "Montserrat";text-transform:uppercase;color:#fff}
  .hookname span{display:block;font-weight:600;font-size:30px;color:var(--gold2);text-transform:none;margin-top:4px}
  .h0{font:900 108px/1.02 "Montserrat";letter-spacing:-.02em;text-transform:uppercase;text-shadow:0 6px 30px rgba(0,0,0,.6)}
  .hooksub{font:600 42px/1.3 "Inter";color:#E6EAF0;margin-top:34px}
  /* câu hỏi kết video, kéo bình luận */
  .ask{margin-top:30px;padding:28px 32px;background:var(--gold);color:#0A1322;font:800 46px/1.2 "Montserrat";border-radius:28px 28px 28px 4px}
  .ask small{display:block;font:600 30px "Inter";margin-top:12px;opacity:.85}
  .kick{font:700 28px "Montserrat";letter-spacing:.16em;color:var(--gold);text-transform:uppercase;margin-bottom:22px}
  .h1{font:800 82px/1.08 "Montserrat";letter-spacing:-.01em}
  .h2{font:700 60px/1.15 "Montserrat"}
  .body{font:500 40px/1.35 "Inter";color:#D8DEE8}
  .gold{color:var(--gold2)}
  .huge{font:900 300px/0.9 "Montserrat";color:var(--gold2);letter-spacing:-.04em}
  .big{font:900 180px/0.95 "Montserrat";color:var(--gold2);letter-spacing:-.03em}

  .row{margin:0 0 22px}
  .row .lab{display:flex;justify-content:space-between;font:600 36px "Inter";margin-bottom:10px}
  .row .lab b{font:800 40px "Montserrat";color:var(--gold2)}
  .track{height:28px;background:rgba(255,255,255,.07)}
  .fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));transform-origin:left;transform:scaleX(0)}
  .row.dim .fill{background:#5E6B80}
  .badge{display:inline-block;margin-top:16px;border:2px solid var(--gold);padding:16px 26px;font:700 38px "Montserrat";background:rgba(10,19,34,.55)}

  .stat{border-left:6px solid var(--gold);padding:6px 0 6px 28px;margin-bottom:26px;background:linear-gradient(90deg,rgba(10,19,34,.7),transparent)}
  .stat .n{font:900 104px/1 "Montserrat";color:var(--gold2)}
  .stat .t{font:500 34px/1.28 "Inter";color:#D8DEE8;margin-top:6px}

  .rank{display:flex;align-items:center;gap:28px;padding:14px 24px;margin-bottom:12px;background:rgba(10,19,34,.55);font:600 42px "Inter"}
  .rank .no{font:800 44px "Montserrat";color:var(--mute);width:110px;white-space:nowrap}
  .rank.me{background:var(--gold);color:var(--bg)}
  .rank.me .no{color:var(--bg)}
  .chips{display:flex;gap:22px;margin-top:28px}
  .chip{flex:1;padding:26px;border:2px solid var(--line);background:rgba(10,19,34,.55)}
  .chip .k{font:600 28px "Inter";color:var(--mute);margin-bottom:10px}
  .chip .v{font:800 64px "Montserrat";color:var(--gold2)}
  .chip .s{font:500 28px "Inter";color:#D8DEE8;margin-top:6px}

  /* phụ đề */
  .cap{position:absolute;left:100px;right:200px;bottom:470px;min-height:150px;display:flex;align-items:flex-end}
  .cap span{font:700 50px/1.25 "Inter";background:rgba(10,19,34,.82);padding:10px 22px;box-decoration-break:clone;-webkit-box-decoration-break:clone;color:#fff}
  .cap span em{font-style:normal;color:var(--gold2)}

  /* hiệu ứng, điều khiển theo thời gian bằng currentTime */
  .fx{animation-fill-mode:both!important;animation-play-state:paused!important;animation-timing-function:cubic-bezier(.2,.8,.2,1)!important}
  @keyframes up{from{opacity:0;transform:translateY(60px)}to{opacity:1;transform:none}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(var(--w))}}
  @keyframes pop{0%{opacity:0;transform:scale(.6)}70%{opacity:1;transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
  @keyframes left{from{opacity:0;transform:translateX(-120px)}to{opacity:1;transform:none}}
  @keyframes right{from{opacity:0;transform:translateX(120px)}to{opacity:1;transform:none}}
  @keyframes drop{0%{opacity:0;transform:translateY(-90px)}60%{opacity:1;transform:translateY(10px)}100%{opacity:1;transform:none}}
  @keyframes zoom{from{opacity:0;transform:scale(1.5);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
  @keyframes blur{from{opacity:0;filter:blur(22px)}to{opacity:1;filter:none}}
  @keyframes wipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
  @keyframes wipeup{from{clip-path:inset(100% 0 0 0);transform:translateY(30px)}to{clip-path:inset(0 0 0 0);transform:none}}
  @keyframes flip{from{opacity:0;transform:perspective(900px) rotateX(85deg)}to{opacity:1;transform:perspective(900px) rotateX(0)}}
  @keyframes rise{from{opacity:0;transform:translateY(40px) rotate(4deg)}to{opacity:1;transform:none}}
  @keyframes tick{from{opacity:0}to{opacity:1}}
  @keyframes marker{from{background-size:0% 40%}to{background-size:100% 40%}}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  @keyframes shine{from{background-position:-150% 0}to{background-position:250% 0}}
  @keyframes sweep{0%{transform:scaleX(0);transform-origin:left}45%{transform:scaleX(1);transform-origin:left}55%{transform:scaleX(1);transform-origin:right}100%{transform:scaleX(0);transform-origin:right}}
  .w,.ch{display:inline-block;white-space:pre}
  .mk{background-image:linear-gradient(color-mix(in srgb,var(--gold) 75%,transparent),color-mix(in srgb,var(--gold) 75%,transparent));background-repeat:no-repeat;background-position:0 88%;background-size:0% 40%;box-decoration-break:clone;-webkit-box-decoration-break:clone}
  .shine{background:linear-gradient(100deg,var(--gold2) 40%,#fff 50%,var(--gold2) 60%) 0 0/250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
  .sweepbar{position:absolute;left:0;right:0;height:10px;background:linear-gradient(90deg,var(--gold),var(--gold2));transform:scaleX(0);z-index:5}
</style>
</head>
<body class="__THEME__">
<div class="scrim"></div>
__AVATAR__
<div class="who __WHOCLASS__"><div class="name">__NAME_MAIN__ <span>__NAME_SUB__</span></div>
  <div class="hdr"><div class="tag">__TAG__</div><div class="step" id="step"></div><div class="date">__DATE__</div></div></div>
<div class="bar-top"></div><div class="progress" id="prog"></div>

__SCENES__

<div class="cap" id="cap"><span></span></div>
<div class="src">__SOURCE__</div>

<script>
const LINES = __LINES__;      // [{start,dur,text}] mốc thời gian lấy từ giọng đọc
const SCENES = __SCENE_TIMES__; // [{in,out}]
const TOTAL = __TOTAL__;
// Gắn thời gian cho từng cảnh và hiệu ứng.
//  data-fx  : up | pop | fade | grow | left | right | drop | zoom | blur | wipe | wipeup | flip   (cả khối)
//             words (từng chữ nhô lên lần lượt) | type (gõ từng ký tự) | marker (bút dạ vàng tô dưới chữ)
//  data-at  : giây tính từ đầu cảnh · data-dur: thời lượng · data-stagger: độ trễ giữa từng chữ (words/type)
//  data-emph: pulse | shine   (nhấn mạnh sau khi hiện, cho số liệu lớn)
//  Cảnh: data-trans = fade | slide | zoom | wipe | blur | rise (bỏ trống thì tự xoay vòng để cảnh nào cũng khác cảnh trước)
const DUR={up:.6,pop:.7,fade:.6,grow:1.0,left:.6,right:.6,drop:.7,zoom:.7,blur:.8,wipe:.8,wipeup:.7,flip:.7,marker:.7};
const TRANS=['slide','zoom','wipe','rise','blur','fade'];
function splitText(el,cls){
  const walk=n=>{[...n.childNodes].forEach(c=>{
    if(c.nodeType===3){
      const parts=cls==='w'?c.textContent.split(/(\s+)/):[...c.textContent];
      const frag=document.createDocumentFragment();
      parts.forEach(p=>{ if(!p) return; if(/^\s+$/.test(p)&&cls==='w'){frag.appendChild(document.createTextNode(p));return;}
        const sp=document.createElement('span'); sp.className=cls; sp.textContent=p; frag.appendChild(sp);});
      c.replaceWith(frag);
    } else if(c.nodeType===1 && !c.classList.contains('w') && !c.classList.contains('ch')) walk(c);
  });};
  walk(el); return [...el.querySelectorAll('.'+cls)];
}
function anim(el,name,dur,delay){el.classList.add('fx');el.style.animation=`${name} ${dur}s ${delay}s`;}
document.querySelectorAll('.scene').forEach((s,i)=>{
  s.dataset.in=SCENES[i].in; s.dataset.out=SCENES[i].out;
  s.dataset.trans=s.dataset.trans||(i===0?'fade':TRANS[(i-1)%TRANS.length]);
  const t0=SCENES[i].in, len=SCENES[i].out-SCENES[i].in;
  // vạch vàng quét ngang mỗi khi sang cảnh mới
  if(i>0){const b=document.createElement('div');b.className='sweepbar';b.style.top=(430+(i%2)*6)+'px';document.body.appendChild(b);anim(b,'sweep',.7,t0-.1);}
  s.querySelectorAll('[data-fx]').forEach(el=>{
    const fx=el.dataset.fx, at=t0+Math.min(parseFloat(el.dataset.at||0), Math.max(0,len-1));
    if(fx==='words'||fx==='type'){
      const units=splitText(el,fx==='words'?'w':'ch');
      const st=parseFloat(el.dataset.stagger||(fx==='words'?.09:.028));
      units.forEach((u,k)=>anim(u,fx==='words'?'rise':'tick',fx==='words'?.5:.05,at+k*st));
    } else if(fx==='marker'){
      el.classList.add('mk'); anim(el,'marker',el.dataset.dur||.7,at);
    } else anim(el,fx,el.dataset.dur||DUR[fx]||.6,at);
    const em=el.dataset.emph;
    if(em==='pulse'){const w=document.createElement('span');w.style.display='inline-block';while(el.firstChild)w.appendChild(el.firstChild);el.appendChild(w);anim(w,'pulse',.6,at+(DUR[fx]||.6)+.3);}
    if(em==='shine'){const w=document.createElement('span');w.className='shine';while(el.firstChild)w.appendChild(el.firstChild);el.appendChild(w);anim(w,'shine',1.2,at+(DUR[fx]||.6)+.2);}
  });
  s.querySelectorAll('[data-count]').forEach(el=>{el.dataset.t0=t0+parseFloat(el.dataset.at||0.2);});
});
// chia câu đọc thành các cụm phụ đề ngắn, thời lượng theo số ký tự
const CHUNKS=[];
for(const L of LINES){
  const words=L.text.split(/\s+/); const parts=[]; let cur=[];
  for(const w of words){cur.push(w); const n=cur.join(' ').length; if(n>38 || (/[,.]$/.test(w)&&n>14)){parts.push(cur.join(' '));cur=[];}}
  if(cur.length)parts.push(cur.join(' '));
  const tot=parts.reduce((a,p)=>a+p.length,0); let t=L.start;
  for(const p of parts){const d=L.dur*p.length/tot; CHUNKS.push({s:t,e:t+d,text:p}); t+=d;}
}
const HL=__HIGHLIGHT__;
const hl=s=>s.replace(new RegExp('(\\d[\\d.,]*\\s*%?'+(HL.length?'|'+HL.join('|'):'')+')','g'),'<em>$1</em>');
const cap=document.querySelector('#cap span');
const scenes=[...document.querySelectorAll('.scene')];
const counters=[...document.querySelectorAll('[data-count]')];
const ease=x=>1-Math.pow(1-x,3);
const HOOK=scenes.length&&scenes[0].classList.contains('hook');
const HDR=[...document.querySelectorAll('.ava,.who,.bar-top,#prog,.src')];
const stepEl=document.getElementById('step');
window.render=function(t){
  for(const a of document.getAnimations()) a.currentTime=t*1000;
  for(const s of scenes){
    const i=+s.dataset.in,o=+s.dataset.out;
    if(t<i||t>=o){s.style.opacity=0;continue;}
    const a=(i===0)?1:Math.min(1,(t-i)/0.4), b=Math.min(1,(o-t)/0.3);   // vào 0,4s, ra 0,3s
    const ea=ease(a), tr=s.dataset.trans;
    let tf='none', clip='none', fil='none', op=Math.min(ea,b);
    if(tr==='slide') tf=`translateX(${(1-ea)*140 - (1-b)*140}px)`;
    if(tr==='zoom')  tf=`scale(${1+(1-ea)*0.12-(1-b)*0.06})`;
    if(tr==='rise')  tf=`translateY(${(1-ea)*90}px)`;
    if(tr==='wipe'){ clip=`inset(0 ${(1-ea)*100}% 0 0)`; op=b; }
    if(tr==='blur')  fil=`blur(${(1-ea)*16+(1-b)*10}px)`;
    s.style.opacity=op; s.style.transform=tf; s.style.clipPath=clip; s.style.filter=fil;
  }
  for(const c of counters){
    const k=Math.max(0,Math.min(1,(t-+c.dataset.t0)/parseFloat(c.dataset.dur||2.2)));
    c.textContent=Math.round(+c.dataset.count*ease(k)).toLocaleString('de-DE')+(c.dataset.suffix||'');
  }
  // cảnh móc: chưa hiện header, nguồn, phụ đề (chữ trên màn hình đã là câu móc); hiện dần khi sang cảnh 2
  const hk=HOOK?Math.max(0,Math.min(1,(t-(+scenes[0].dataset.out))/0.4)):1;
  for(const e of HDR) e.style.opacity=hk;
  const cur=scenes.find(s=>t>=+s.dataset.in&&t<+s.dataset.out);
  // cảnh "clear" (bản đồ…): làm nhạt lớp phủ tối để thấy rõ hình
  const scr=document.querySelector('.scrim'); if(scr) scr.style.opacity=(cur&&cur.dataset.clear)?0.45:1;
  stepEl.textContent=cur&&cur.dataset.step?cur.dataset.step:'';
  const ch=(HOOK&&hk<1)?null:CHUNKS.find(c=>t>=c.s&&t<c.e);
  cap.innerHTML=ch?hl(ch.text):''; cap.style.display=ch?'inline':'none';
  document.getElementById('prog').style.width=(780*Math.min(1,t/TOTAL))+'px';
};
</script>
</body>
</html>
